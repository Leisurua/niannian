openapi: 3.1.0
info:
  title: NianNian API
  version: 1.0.0
  description: Current REST operations implemented by NianNian. Public DTOs are not ORM entities. Authentication is Demo-only;
    conversation input is TEXT with explicit Mock or configured real LLM mode. Family device registration, human text messages
    and recipient receipts are implemented. Weather, consented interaction statistics, account ZIP export and account deletion with authenticated receipts are implemented. External-copy completion requires verified operator evidence;
    see roadmap.md. GET /health, /docs and /openapi.json are unversioned runtime endpoints. Provider metadata, vectors, raw
    audio and transcripts are not exposed as public resource content.
servers:
- url: /v1
  description: Versioned API base path
tags:
- name: Auth
- name: Families
- name: Consents
- name: Memories
- name: Files
- name: Avatars
- name: Reminders
- name: Conversations
- name: SignalEvents
- name: Notifications
- name: Devices
- name: Messages
security:
- bearerAuth: []
x-websocket-channels:
  /ws/conversations/{conversation_id}:
    summary: Conversation state channel
    security:
    - bearerAuth: []
    parameters:
      conversation_id:
        $ref: '#/components/parameters/ConversationId'
    clientMessages:
      $ref: '#/components/schemas/WebSocketClientMessage'
    serverMessages:
      $ref: '#/components/schemas/WebSocketServerMessage'
    description: Implemented authenticated owner-only TEXT/state channel. Android dispatches exact speech/text control
      commands locally, sends other final transcripts as text.input and device TTS reads assistant.text.
      Repeat and speech-rate replay use repeat; stop uses interrupt and end uses the existing REST end operation.
      Raw audio is not uploaded; Audio/ASR/TTS names in message enums remain
      reserved or rejected as unavailable. Initial session.ready payload includes llm_mode (mock or real) and voice_allowed
      (boolean, owner's explicit self VOICE consent). voice.permission carries allowed (boolean) when this consent changes
      or expires; the server rechecks it each loop (at most one second idle wait). Clients stop device speech on denial. Permission
      events are unsolicited and are delivered before same-loop turn output. assistant.text source_labels contains Mock for
      simulated responses or AI for real-mode responses. Real mode uses non-streaming JSON Chat Completions; errors use fixed
      fallback text and an error event. Recent context is connection-local and cleared on disconnect; clients must not automatically
      replay input. Solicited events carry in_reply_to with the originating client sequence, including asynchronous turn results
      and interrupt acknowledgements. The initial ready, unsolicited invitations and protocol rejection errors may omit it.
      Clients validate server sequence continuity before discarding events older than the latest input or interrupt.
      interrupt cancels pending generation but retains the last completed reply and its permission dependencies within
      this connection, allowing a spoken repeat after device ASR starts. New text generation clears replay eligibility;
      cancelled unfinished output is never replayable. repeat/slow_down revalidate memory permissions before publishing.
      text.input payload accepts text plus optional timezone (valid IANA name, default Asia/Shanghai) and
      weather_city_id (public Open-Meteo city ID, positive integer up to 2147483647). Daily date/time, today's
      forecast and owner reminders use deterministic data queries, bypassing RAG and the LLM in both real and Mock modes.
      Their source_labels identify server time, Open-Meteo forecast or owner reminder records/feedback.
      Today's plans include recurring occurrences before worker execution and postponed items due today, scoped to
      the authenticated owner and conversation family. Feedback targets a named or numbered item from this connection;
      ambiguous, negative, quoted or stale commands make no change. LATER defaults to ten minutes and accepts 1-1440
      minutes. Successful feedback is committed before assistant.text carries reminders_changed=true; clients refresh
      their reminder cache. Repeat refreshes read queries and never reapplies feedback. Context is cleared on disconnect.
paths:
  /avatar-generation:
    get:
      tags:
      - Avatars
      operationId: getAvatarGenerationCapabilities
      summary: Configured photo editor and disclosure; real generation is dev-only
      responses:
        '200':
          description: No-store capabilities; available=false when disabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvatarGenerationCapabilities'
  /avatar-jobs:
    post:
      tags:
      - Avatars
      operationId: createAvatarJob
      summary: Authorize a private photo upload for the elder owner
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvatarCreate'
      description: Requires active family membership, ELDER role, current explicit self
        PORTRAIT consent and photo/provider approval. Returns a signed PUT upload_url
        and required_headers only while UPLOADING; original upload window is at most
        300 seconds. Source is at most 5 MiB. Idempotency does not resend image generation.
      responses:
        '201':
          description: Own current job; no-store. READY does not enable the avatar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvatarJobResponse'
        '409':
          description: Authorization/provider changed, duplicate request differs, or
            another job is in progress
        '503':
          description: Generation disabled
  /avatar-jobs/latest:
    get:
      tags:
      - Avatars
      operationId: getLatestAvatarJob
      summary: Resume the newest job under the current self PORTRAIT grant
      parameters:
      - name: family_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: No-store; null when absent/expired
          content:
            application/json:
              schema:
                type: object
                required:
                - job
                properties:
                  job:
                    anyOf:
                    - $ref: '#/components/schemas/AvatarJobResponse'
                    - type: 'null'
        '403':
          description: Membership, role or self PORTRAIT consent missing
  /avatar-jobs/{job_id}:
    parameters:
    - name: job_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      tags:
      - Avatars
      operationId: getAvatarJob
      summary: Read own authorized generation progress
      responses:
        '200':
          description: Own current job; no-store. READY does not enable the avatar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvatarJobResponse'
        '404':
          description: Not owned, revoked, removed or expired
    delete:
      tags:
      - Avatars
      operationId: deleteAvatarJob
      summary: Cancel and remove own photo/avatar resources
      responses:
        '202':
          description: Immediately inaccessible; private-object cleanup is asynchronous.
            Repeat removal is allowed. Account/family membership is still required.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    const: CANCELLED
  /avatar-jobs/{job_id}/complete-upload:
    parameters:
    - name: job_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      tags:
      - Avatars
      operationId: completeAvatarPhotoUpload
      summary: Validate and sanitize the uploaded photo, then queue once
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      description: Uses original upload window plus cleanup margin (360 seconds total).
        Repeated completion does not enqueue another paid operation. The dedicated avatar
        worker runs STYLIZING -> PREPARING -> RENDERING -> READY; no automatic generation
        retry.
      responses:
        '200':
          description: Own current job; no-store. READY does not enable the avatar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvatarJobResponse'
        '409':
          description: Upload window closed
        '422':
          description: Photo format, bytes or checksum invalid
  /avatar-jobs/{job_id}/confirm:
    parameters:
    - name: job_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      tags:
      - Avatars
      operationId: confirmAvatarJob
      summary: Explicitly enable the downloaded and previewed avatar
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvatarConfirm'
      description: Requires current grant and exact pack_checksum. Replaces the previous
        ACTIVE job; only confirmation removes the 24-hour pending expiration.
      responses:
        '200':
          description: Own current job; no-store. READY does not enable the avatar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvatarJobResponse'
        '409':
          description: Not READY/ACTIVE or package SHA-256 does not match
  /avatar-jobs/{job_id}/pack:
    parameters:
    - name: job_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      tags:
      - Avatars
      operationId: downloadAvatarPack
      summary: Download own authorized pack
      responses:
        '200':
          description: Authenticated no-store binary; SHA-256 checked before returning.
            READY or ACTIVE only.
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '404':
          description: Unauthorized or no longer available
        '409':
          description: Not READY/ACTIVE
  /avatar-jobs/{job_id}/preview:
    parameters:
    - name: job_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      tags:
      - Avatars
      operationId: downloadAvatarPreview
      summary: Download own authorized preview
      responses:
        '200':
          description: Authenticated no-store binary; SHA-256 checked before returning.
            READY or ACTIVE only.
          content:
            image/png:
              schema:
                type: string
                format: binary
        '404':
          description: Unauthorized or no longer available
        '409':
          description: Not READY/ACTIVE
  /me/export:
    get:
      tags: [Account]
      summary: Export the authenticated account's data and safe photos
      operationId: exportAccount
      description: No-store ZIP with account.json, photos/{file_id}, and authorized avatars/{job_id}/{source|pack|preview}; explicit own-data fields, no credentials, provider internals or other subjects' content. Removed/expired content is excluded. Default 100 MiB and 10000 rows per collection limit; storage failure aborts the whole export.
      responses:
        '200':
          description: Complete in-memory ZIP, not retained on the server
          content:
            application/zip:
              schema: {type: string, format: binary}
        '401': {description: Session invalid}
        '413': {description: Account exceeds export limit; operator assistance required}
        '503': {description: Storage or database unavailable; no partial export}
  /me/deletion:
    post:
      tags: [Account]
      summary: Delete the authenticated account and revoke all sessions
      operationId: deleteAccount
      description: Only self; explicit confirmation required. Save a cryptographically random receipt_token (at least 32 random bytes encoded as URL-safe text) BEFORE sending. All sessions become invalid when accepted. Database content is erased atomically; private objects are retried by worker. A nameless user tombstone preserves other subjects' references and prevents fixed Demo credentials resurrecting the account. No blanket deletion claim for unverified backups, providers or offline devices.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirmation, receipt_token]
              properties:
                confirmation: {type: string, const: DELETE_MY_ACCOUNT}
                receipt_token: {type: string, minLength: 43, maxLength: 128, writeOnly: true}
      responses:
        '202':
          description: Accepted; no-store deletion receipt. local_status=PENDING/RETRY/ERASED; status stays PENDING until local erasure and verified backup/provider confirmations. Contains id, requested_at, local_erased_at, last_error_code, backup (status, due_at, overdue), providers (provider, status), retained and device_notice.
        '401': {description: Session invalid; use the receipt lookup after a lost response}
        '409': {description: Receipt credential already used; generate an independent random credential}
        '422': {description: Explicit confirmation or valid receipt credential missing}
  /account-deletions/{deletion_id}:
    get:
      tags: [Account]
      summary: Read a deletion receipt after logout
      operationId: getAccountDeletion
      security: []
      description: Rate-limited; requires the separate X-Deletion-Token secret, never a query parameter. Returns no account profile or content. Same 404 for absent receipts and wrong secrets; no-store on success.
      parameters:
      - name: deletion_id
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: X-Deletion-Token
        in: header
        required: true
        schema: {type: string, minLength: 43, maxLength: 128}
      responses:
        '200': {description: Same receipt as POST /me/deletion; COMPLETED covers managed server and verified external-copy work, with retained/device boundaries explicitly listed}
        '404': {description: Receipt absent or credential invalid}
        '429': {description: Rate limited}
  /account-deletions/lookup:
    post:
      tags: [Account]
      summary: Recover a deletion receipt after a lost response
      operationId: lookupAccountDeletion
      security: []
      description: Rate-limited secret-based lookup; identical receipt response and privacy rules. No active account login is needed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [receipt_token]
              properties:
                receipt_token: {type: string, minLength: 43, maxLength: 128, writeOnly: true}
      responses:
        '200': {description: No-store deletion receipt}
        '404': {description: Receipt absent or credential invalid}
        '429': {description: Rate limited}
  /statistics:
    get:
      tags:
      - Reports
      summary: Statistics
      operationId: getStatistics
      description: Aggregates retained authorized data over local dates [start, end). Returns period, interaction (sessions, turns, active_seconds, days, hourly_turns, night_turns, emotions, repeated_topics, simulated_turns), reminders, attention, missing_data, collection_enabled, generated_at, notice and methodology. Requires REPORT_READ plus shared INTERACTION_STATS for family readers; X-Access-Reason must be FAMILY_CHECK_IN or FOLLOW_UP. Reminder and signal scopes are checked independently. No-store.
      parameters:
      - name: family_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
          title: Family Id
      - name: owner_user_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
          title: Owner User Id
      - name: start
        in: query
        required: true
        schema:
          type: string
          format: date
          title: Start
      - name: end
        in: query
        required: true
        schema:
          type: string
          format: date
          title: End
      - name: timezone
        in: query
        required: false
        schema:
          type: string
          maxLength: 64
          default: Asia/Shanghai
          title: Timezone
      - name: x-access-reason
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Access-Reason
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Authentication, permission or provider error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Authentication, permission or provider error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Authentication, permission or provider error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /reports/weekly:
    get:
      tags:
      - Reports
      summary: Weekly
      operationId: getWeeklyReport
      description: Generates a fixed-template weekly report on demand without storing a report snapshot. week_start must be a Monday within the last 28 days, defaults to this week. Returns family_id, owner_user_id, current, previous, comparison (sessions_delta, turns_delta, active_seconds_delta, night_turns_delta) and text. Each period uses the statistics response shape. Deltas are null when either week has no interaction records. Current permissions and retention apply on every request. No-store.
      parameters:
      - name: family_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
          title: Family Id
      - name: owner_user_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
          title: Owner User Id
      - name: week_start
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Week Start
      - name: timezone
        in: query
        required: false
        schema:
          type: string
          maxLength: 64
          default: Asia/Shanghai
          title: Timezone
      - name: x-access-reason
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Access-Reason
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Authentication, permission or provider error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Authentication, permission or provider error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Authentication, permission or provider error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /reports/data:
    delete:
      tags:
      - Reports
      summary: Erase
      operationId: deleteMyInteractionStatistics
      description: Deletes only the authenticated owner statistics within the selected family. Also fences in-flight turns begun before deletion. An existing enabled collection grant continues to apply to future turns. Does not delete conversations or change other members data. No-store.
      parameters:
      - name: family_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
          title: Family Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '204':
          description: Successful Response
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Authentication, permission or provider error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Authentication, permission or provider error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Authentication, permission or provider error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /weather/cities:
    get:
      tags:
      - Weather
      summary: Cities
      operationId: searchWeatherCities
      description: Searches the public Open-Meteo city catalogue by manually entered city name. Returns items with id and label, and source attribution. Sends no application credentials or device location to the provider.
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 2
          maxLength: 80
          title: Q
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Authentication, permission or provider error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Authentication, permission or provider error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Authentication, permission or provider error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /weather/current:
    get:
      tags:
      - Weather
      summary: Current
      operationId: getCurrentWeather
      description: Accepts a public Open-Meteo city ID, resolves catalogue coordinates, then returns city, temperature_c, weather_code, description, observed_at, utc_offset_seconds, fetched_at and source. Rejects stale data older than three hours and invalid provider responses with WEATHER_UNAVAILABLE (503). Does not accept device coordinates. No-store.
      parameters:
      - name: city_id
        in: query
        required: true
        schema:
          type: integer
          maximum: 2147483647
          exclusiveMinimum: 0
          title: City Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Authentication, permission or provider error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Authentication, permission or provider error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Authentication, permission or provider error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/login:
    post:
      tags:
      - Auth
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '201':
          description: Signed in and device session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimitError'
  /auth/refresh:
    post:
      tags:
      - Auth
      operationId: refreshAccessToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Rotated access and refresh tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          $ref: '#/components/responses/AuthError'
  /auth/logout:
    post:
      tags:
      - Auth
      operationId: logout
      responses:
        '204':
          description: Current device session revoked
        '401':
          $ref: '#/components/responses/AuthError'
  /auth/logout-all:
    post:
      tags:
      - Auth
      operationId: logoutAll
      responses:
        '204':
          description: All sessions for current user revoked
        '401':
          $ref: '#/components/responses/AuthError'
  /me:
    get:
      tags:
      - Auth
      operationId: getCurrentUser
      responses:
        '200':
          description: Current user and memberships
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/AuthError'
  /families:
    get:
      tags:
      - Families
      operationId: listFamilies
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Current user's family memberships
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilySummaryPage'
    post:
      tags:
      - Families
      operationId: createFamily
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FamilyCreate'
      responses:
        '201':
          description: Family created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyResponse'
        '409':
          $ref: '#/components/responses/ConflictError'
  /families/{family_id}:
    parameters:
    - $ref: '#/components/parameters/FamilyId'
    get:
      tags:
      - Families
      operationId: getFamily
      responses:
        '200':
          description: Family
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /families/{family_id}/invitations:
    parameters:
    - $ref: '#/components/parameters/FamilyId'
    post:
      tags:
      - Families
      operationId: createFamilyInvitation
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationCreate'
      responses:
        '201':
          description: One-time invitation token (shown once)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationResponse'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /families/{family_id}/invitations/{invitation_id}/revoke:
    parameters:
    - $ref: '#/components/parameters/FamilyId'
    - $ref: '#/components/parameters/InvitationId'
    post:
      tags:
      - Families
      operationId: revokeFamilyInvitation
      responses:
        '204':
          description: Invitation revoked
