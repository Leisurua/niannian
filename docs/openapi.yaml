      - provider_label
      - max_photo_bytes
      - notice
      properties:
        available:
          type: boolean
        provider_id:
          type: string
          pattern: ^[a-f0-9]{64}$
        provider_label:
          type: string
        max_photo_bytes:
          type: integer
          maximum: 5242880
        notice:
          type: string
    AvatarCreate:
      type: object
