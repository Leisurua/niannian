openapi: 3.1.0
info:
  title: NianNian API
  version: 1.0.0
  description: |
    API contract for the NianNian AI companion system. Public DTOs are not ORM entities.
    Sensitive conversation content, embeddings, provider metadata and tokens are never
    exposed through public resource schemas.
servers:
  - url: /v1
    description: Versioned API base path
tags:
  - name: Auth
  - name: Families
  - name: Consents
  - name: Memories
  - name: Files
  - name: Reminders
  - name: Conversations
  - name: SignalEvents
  - name: Notifications
  - name: Reports
  - name: Emergency
  - name: Devices
  - name: Audit
  - name: Privacy
security:
  - bearerAuth: []
x-websocket-channels:
  /ws/conversations/{conversation_id}:
    summary: Conversation state channel
    security:
      - bearerAuth: []
    parameters:
      conversation_id:
        $ref: '#/components/parameters/ConversationId'
    clientMessages:
      $ref: '#/components/schemas/WebSocketClientMessage'
    serverMessages:
      $ref: '#/components/schemas/WebSocketServerMessage'
paths:
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              credential:
                type: DEMO
                identifier: demo-elder
              device:
                device_id: demo-elder-tablet
                name: Elder tablet
                app_version: 0.1.0
      responses:
        '201':
          description: Signed in and device session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              example:
                access_token: eyJhbGciOi...
                refresh_token: r1_demo_only
                token_type: Bearer
                expires_in: 900
                user:
                  id: 0192f1e4-6ed8-7c21-a4c1-5d58db7c1001
                  display_name: 王阿姨
                  timezone: Asia/Shanghai
                  global_status: ACTIVE
                families: []
                device_session:
                  id: 0192f1e4-6ed8-7c21-a4c1-5d58db7c1002
                  device_name: Elder tablet
                  created_at: '2026-09-22T06:00:00Z'
        '401': { $ref: '#/components/responses/AuthError' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimitError' }
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshAccessToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Rotated access and refresh tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401': { $ref: '#/components/responses/AuthError' }
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      responses:
        '204': { description: Current device session revoked }
        '401': { $ref: '#/components/responses/AuthError' }
  /auth/logout-all:
    post:
      tags: [Auth]
      operationId: logoutAll
      responses:
        '204': { description: All sessions for current user revoked }
        '401': { $ref: '#/components/responses/AuthError' }
  /me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      responses:
        '200':
          description: Current user and memberships
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
        '401': { $ref: '#/components/responses/AuthError' }
  /families:
    get:
      tags: [Families]
      operationId: listFamilies
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Current user's family memberships
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FamilySummaryPage' }
    post:
      tags: [Families]
      operationId: createFamily
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FamilyCreate' }
      responses:
        '201':
          description: Family created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FamilyResponse' }
        '409': { $ref: '#/components/responses/ConflictError' }
  /families/{family_id}:
    parameters:
      - $ref: '#/components/parameters/FamilyId'
    get:
      tags: [Families]
      operationId: getFamily
      responses:
        '200':
          description: Family
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FamilyResponse' }
        '404': { $ref: '#/components/responses/NotFoundError' }
  /families/{family_id}/invitations:
    parameters:
      - $ref: '#/components/parameters/FamilyId'
    post:
      tags: [Families]
      operationId: createFamilyInvitation
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvitationCreate' }
      responses:
        '201':
          description: One-time invitation token (shown once)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationResponse' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
  /families/{family_id}/invitations/{invitation_id}/revoke:
    parameters:
      - $ref: '#/components/parameters/FamilyId'
      - $ref: '#/components/parameters/InvitationId'
    post:
      tags: [Families]
      operationId: revokeFamilyInvitation
      responses:
        '204': { description: Invitation revoked }
        '404': { $ref: '#/components/responses/NotFoundError' }
  /family-invitations/{token}/accept:
    parameters:
      - name: token
        in: path
        required: true
        schema: { type: string, minLength: 16, maxLength: 512 }
    post:
      tags: [Families]
      operationId: acceptFamilyInvitation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvitationAccept' }
      responses:
        '200':
          description: Pending or activated family membership
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FamilyMemberResponse' }
        '400': { $ref: '#/components/responses/BadRequestError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
  /families/{family_id}/members:
    parameters:
      - $ref: '#/components/parameters/FamilyId'
    get:
      tags: [Families]
      operationId: listFamilyMembers
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/MemberStatus' }
      responses:
        '200':
          description: Family members
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FamilyMemberPage' }
  /families/{family_id}/members/{member_id}:
    parameters:
      - $ref: '#/components/parameters/FamilyId'
      - $ref: '#/components/parameters/MemberId'
    get:
      tags: [Families]
      operationId: getFamilyMember
      responses:
        '200':
          description: Family member
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FamilyMemberResponse' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    patch:
      tags: [Families]
      operationId: updateFamilyMember
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FamilyMemberUpdate' }
      responses:
        '200':
          description: Updated member
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FamilyMemberResponse' }
        '409': { $ref: '#/components/responses/ConflictError' }
  /families/{family_id}/members/{member_id}/leave:
    parameters:
      - $ref: '#/components/parameters/FamilyId'
      - $ref: '#/components/parameters/MemberId'
    post:
      tags: [Families]
      operationId: leaveFamilyMember
      responses:
        '204': { description: Member left family }
  /consents:
    get:
      tags: [Consents]
      operationId: listConsents
      parameters:
        - name: family_id
          in: query
          schema: { $ref: '#/components/schemas/Id' }
        - name: subject_user_id
          in: query
          schema: { $ref: '#/components/schemas/Id' }
        - name: grantee_user_id
          in: query
          schema: { $ref: '#/components/schemas/Id' }
        - name: scope
          in: query
          schema: { $ref: '#/components/schemas/ConsentScope' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Visible consent history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentPage' }
    post:
      tags: [Consents]
      operationId: grantConsent
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsentCreate' }
      responses:
        '201':
          description: Immutable consent record
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentResponse' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
  /consents/{consent_id}:
    parameters:
      - $ref: '#/components/parameters/ConsentId'
    get:
      tags: [Consents]
      operationId: getConsent
      responses:
        '200':
          description: Consent history item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentResponse' }
        '404': { $ref: '#/components/responses/NotFoundError' }
  /consents/{consent_id}/revoke:
    parameters:
      - $ref: '#/components/parameters/ConsentId'
    post:
      tags: [Consents]
      operationId: revokeConsent
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsentRevoke' }
      responses:
        '201':
          description: New immutable revoked history record
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentResponse' }
        '409': { $ref: '#/components/responses/ConflictError' }
  /memories:
    get:
      tags: [Memories]
      operationId: listMemories
      parameters:
        - name: family_id
          in: query
          schema: { $ref: '#/components/schemas/Id' }
        - name: subject_user_id
          in: query
          schema: { $ref: '#/components/schemas/Id' }
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/MemoryType' }
        - name: verification_status
          in: query
          schema: { $ref: '#/components/schemas/MemoryStatus' }
        - name: pending_confirmation
          in: query
          schema: { type: boolean }
        - name: q
          in: query
          schema: { type: string, maxLength: 160 }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Authorized memories only
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryPage' }
    post:
      tags: [Memories]
      operationId: createMemory
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemoryCreate' }
      responses:
        '201':
          description: Memory created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryResponse' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
  /memories/{memory_id}:
    parameters:
      - $ref: '#/components/parameters/MemoryId'
    get:
      tags: [Memories]
      operationId: getMemory
      responses:
        '200':
          description: Authorized memory detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryDetailResponse' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    patch:
      tags: [Memories]
      operationId: updateMemory
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemoryUpdate' }
      responses:
        '200':
          description: Updated memory
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryResponse' }
        '409': { $ref: '#/components/responses/ConflictError' }
    delete:
      tags: [Memories]
      operationId: deleteMemory
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Memory hidden immediately; cleanup asynchronous
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataJobResponse' }
        '404': { $ref: '#/components/responses/NotFoundError' }
  /memories/{memory_id}/confirm:
    parameters: [{ $ref: '#/components/parameters/MemoryId' }]
    post:
      tags: [Memories]
      operationId: confirmMemory
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200':
          description: Confirmed memory
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryResponse' }
        '409': { $ref: '#/components/responses/ConflictError' }
  /memories/{memory_id}/reject:
    parameters: [{ $ref: '#/components/parameters/MemoryId' }]
    post:
      tags: [Memories]
      operationId: rejectMemory
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200':
          description: Rejected memory
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryResponse' }
  /memories/{memory_id}/revoke:
    parameters: [{ $ref: '#/components/parameters/MemoryId' }]
    post:
      tags: [Memories]
      operationId: revokeMemory
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200':
          description: Revoked memory
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryResponse' }
  /memories/{memory_id}/feedback:
    parameters: [{ $ref: '#/components/parameters/MemoryId' }]
    post:
      tags: [Memories]
      operationId: reportMemoryFeedback
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemoryFeedbackRequest' }
      responses:
        '202': { description: Feedback accepted and queued for review }
  /files/upload-requests:
    post:
      tags: [Files]
      operationId: createFileUploadRequest
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FileUploadRequest' }
      responses:
        '201':
          description: Short-lived signed upload URL
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignedUploadResponse' }
        '413': { $ref: '#/components/responses/FileTooLargeError' }
  /files/{file_id}/confirm:
    parameters: [{ $ref: '#/components/parameters/FileId' }]
    post:
      tags: [Files]
      operationId: confirmFileUpload
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FileUploadConfirm' }
      responses:
        '202':
          description: Object validation/processing queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileAssetResponse' }
  /files/{file_id}/download-url:
    parameters: [{ $ref: '#/components/parameters/FileId' }]
    get:
      tags: [Files]
      operationId: createFileDownloadUrl
      responses:
        '200':
          description: Short-lived authorized URL
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignedDownloadResponse' }
        '404': { $ref: '#/components/responses/NotFoundError' }
  /files/{file_id}:
    parameters: [{ $ref: '#/components/parameters/FileId' }]
    delete:
      tags: [Files]
      operationId: deleteFile
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '202': { description: File deletion queued }
  /reminders:
    get:
      tags: [Reminders]
      operationId: listReminders
      parameters:
        - name: family_id
          in: query
          schema: { $ref: '#/components/schemas/Id' }
        - name: owner_user_id
          in: query
          schema: { $ref: '#/components/schemas/Id' }
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/ReminderType' }
        - name: active
          in: query
          schema: { type: boolean }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Reminder rules
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReminderPage' }
    post:
      tags: [Reminders]
      operationId: createReminder
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReminderCreate' }
      responses:
        '201':
          description: Reminder created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReminderResponse' }
  /reminders/{reminder_id}:
    parameters: [{ $ref: '#/components/parameters/ReminderId' }]
    get:
      tags: [Reminders]
      operationId: getReminder
      responses:
        '200':
          description: Reminder
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReminderResponse' }
    patch:
      tags: [Reminders]
      operationId: updateReminder
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReminderUpdate' }
      responses:
        '200':
          description: Updated reminder
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReminderResponse' }
        '409': { $ref: '#/components/responses/ConflictError' }
    delete:
      tags: [Reminders]
      operationId: deleteReminder
      responses:
        '204': { description: Reminder disabled/deleted }
  /reminders/{reminder_id}/executions:
    parameters: [{ $ref: '#/components/parameters/ReminderId' }]
    get:
      tags: [Reminders]
      operationId: listReminderExecutions
      parameters:
        - name: feedback_status
          in: query
          schema: { $ref: '#/components/schemas/ReminderFeedbackStatus' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Reminder executions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReminderExecutionPage' }
  /reminder-executions/{execution_id}/feedback:
    parameters: [{ $ref: '#/components/parameters/ExecutionId' }]
    post:
      tags: [Reminders]
      operationId: submitReminderFeedback
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReminderFeedbackRequest' }
      responses:
        '200':
          description: Feedback recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReminderExecutionResponse' }
        '409': { $ref: '#/components/responses/ConflictError' }
  /conversations:
    post:
      tags: [Conversations]
      operationId: createConversation
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConversationCreate' }
      responses:
        '201':
          description: Conversation created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationResponse' }
        '503': { $ref: '#/components/responses/UnavailableError' }
  /conversations/{conversation_id}:
    parameters: [{ $ref: '#/components/parameters/ConversationId' }]
    get:
      tags: [Conversations]
      operationId: getConversation
      responses:
        '200':
          description: Session metadata and authorized summary status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationResponse' }
        '404': { $ref: '#/components/responses/NotFoundError' }
  /conversations/{conversation_id}/end:
    parameters: [{ $ref: '#/components/parameters/ConversationId' }]
    post:
      tags: [Conversations]
      operationId: endConversation
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConversationEndRequest' }
      responses:
        '200':
          description: Conversation ended
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationResponse' }
  /conversations/{conversation_id}/summary:
    parameters: [{ $ref: '#/components/parameters/ConversationId' }]
    post:
      tags: [Conversations]
      operationId: requestConversationSummary
      responses:
        '202':
          description: Summary generation requested
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationSummaryJob' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
  /signal-events:
    get:
      tags: [SignalEvents]
      operationId: listSignalEvents
      parameters:
        - name: family_id
          in: query
          schema: { $ref: '#/components/schemas/Id' }
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/SignalType' }
        - name: severity
          in: query
          schema: { $ref: '#/components/schemas/SignalSeverity' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/SignalStatus' }
        - name: from
          in: query
          schema: { $ref: '#/components/schemas/Timestamp' }
        - name: to
          in: query
          schema: { $ref: '#/components/schemas/Timestamp' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Authorized signal events
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignalEventPage' }
  /signal-events/{event_id}:
    parameters: [{ $ref: '#/components/parameters/EventId' }]
    get:
      tags: [SignalEvents]
      operationId: getSignalEvent
      responses:
        '200':
          description: Explainable signal detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignalEventDetailResponse' }
        '404': { $ref: '#/components/responses/NotFoundError' }
  /signal-events/{event_id}/ack:
    parameters: [{ $ref: '#/components/parameters/EventId' }]
    post:
      tags: [SignalEvents]
      operationId: acknowledgeSignalEvent
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200':
          description: Acknowledged signal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignalEventDetailResponse' }
        '409': { $ref: '#/components/responses/ConflictError' }
  /signal-events/{event_id}/contact:
    parameters: [{ $ref: '#/components/parameters/EventId' }]
    post:
      tags: [SignalEvents]
      operationId: contactForSignalEvent
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignalContactRequest' }
      responses:
        '202':
          description: Contact flow initiated; does not mean connected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmergencyCallResponse' }
  /signal-events/{event_id}/false-positive:
    parameters: [{ $ref: '#/components/parameters/EventId' }]
    post:
      tags: [SignalEvents]
      operationId: markSignalFalsePositive
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FalsePositiveRequest' }
      responses:
        '200':
          description: False positive recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignalEventDetailResponse' }
