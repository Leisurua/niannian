              schema:
                type: object
                required:
                - items
                - page
                - request_id
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/FamilyTextMessage'
                  page:
                    $ref: '#/components/schemas/PageInfo'
                  request_id:
                    type: string
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Authentication, family scope or state rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Authentication, family scope or state rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Authentication, family scope or state rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Authentication, family scope or state rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      description: Requires a registered session and current ACTIVE family membership. INBOX contains only this user's
        deliveries; OUTBOX only this user's sent messages. Results are ordered by increasing sequence. Pass page.next_cursor
        as after_sequence (or cursor); cursor takes precedence. Reload from zero to refresh existing receipts. Optional
        family_id must match the current binding.
