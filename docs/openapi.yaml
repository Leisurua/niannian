        '200':
          description: Cancellation result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountDeletionResponse' }
        '409': { $ref: '#/components/responses/ConflictError' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: access-token
  parameters:
    FamilyId: { name: family_id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    InvitationId: { name: invitation_id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    MemberId: { name: member_id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    ConsentId: { name: consent_id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    MemoryId: { name: memory_id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    FileId: { name: file_id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    ReminderId: { name: reminder_id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    ExecutionId: { name: execution_id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    ConversationId: { name: conversation_id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    EventId: { name: event_id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    NotificationId: { name: notification_id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    ReportId: { name: report_id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    ContactId: { name: contact_id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    CallId: { name: call_id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    DeviceId: { name: device_id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    ExportId: { name: export_id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    DeletionRequestId: { name: request_id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string, maxLength: 512 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
  responses:
    AuthError:
      description: Authentication failed
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    ForbiddenError:
      description: Authenticated but not allowed
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    NotFoundError:
      description: Missing or intentionally hidden resource
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    BadRequestError:
      description: Invalid state transition or request
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    ValidationError:
      description: Schema validation error
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    ConflictError:
      description: Conflict or optimistic concurrency failure
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    RateLimitError:
      description: Rate limited
      headers: { Retry-After: { schema: { type: integer } } }
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    UnavailableError:
      description: Service or provider temporarily unavailable
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    FileTooLargeError:
      description: File exceeds configured limit
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  examples:
    UserElder:
      value:
        id: 0192f1e4-6ed8-7c21-a4c1-5d58db7c1001
        display_name: 王阿姨
        timezone: Asia/Shanghai
        global_status: ACTIVE
  schemas:
    Id: { type: string, format: uuid }
    Timestamp: { type: string, format: date-time }
    LocalDate: { type: string, format: date }
    TimeOfDay: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9](:[0-5][0-9])?$' }
    Version: { type: integer, minimum: 1 }
    ConsentScope:
      type: string
      enum: [VOICE, PORTRAIT, FAMILY_MEMORY, HEALTH_MEDICATION, CONVERSATION_SUMMARY, CAMERA_PROXIMITY, NOTIFICATION_TO_FAMILY]
    FamilyRole: { type: string, enum: [ELDER, CHILD, CAREGIVER, EMERGENCY_CONTACT] }
    MemberStatus: { type: string, enum: [PENDING, ACTIVE, REVOKED, LEFT] }
    MemoryType: { type: string, enum: [PERSON, RELATIONSHIP, EVENT, PLACE, PREFERENCE, TABOO, PHOTO] }
    MemoryStatus: { type: string, enum: [PENDING, CONFIRMED, REJECTED, REVOKED, DELETED] }
    ReminderType: { type: string, enum: [CALENDAR, WEATHER, MEDICATION, WATER, CLOTHING, COMPANIONSHIP] }
    ReminderFeedbackStatus: { type: string, enum: [PENDING, DONE, LATER, SKIPPED, NO_RESPONSE] }
    SignalType: { type: string, enum: [PHYSICAL_DISCOMFORT, EMOTION_EXPRESSION, IMPORTANT_MEMORY, MISS_FAMILY, SCAM_RISK, EMERGENCY] }
    SignalSeverity: { type: string, enum: [L0, L1, L2, L3, L4] }
    SignalStatus: { type: string, enum: [DETECTED, VALIDATED, NOTIFIED, ACKNOWLEDGED, CONTACTED, FALSE_POSITIVE, RESOLVED, WITHHELD, NOTIFICATION_FAILED] }
    NotificationChannel: { type: string, enum: [IN_APP, PUSH, SMS, PHONE] }
    NotificationStatus: { type: string, enum: [PENDING, QUEUED, SENT, DELIVERED, READ, FAILED, CANCELLED] }
    ErrorDetail:
      type: object
      required: [field, reason]
      properties:
        field: { type: string }
        reason: { type: string }
    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: MEMORY_NOT_FOUND }
        message: { type: string, example: 这条家庭记忆已不存在或你没有查看权限。 }
        details:
          type: array
          items: { $ref: '#/components/schemas/ErrorDetail' }
    ErrorResponse:
      type: object
      required: [error, request_id]
      properties:
        error: { $ref: '#/components/schemas/ErrorBody' }
        request_id: { type: string, example: req_01J9N9M7Z7 }
    PageInfo:
      type: object
      required: [limit, has_more]
      properties:
        limit: { type: integer, minimum: 1, maximum: 100 }
        next_cursor: { type: string, nullable: true }
        has_more: { type: boolean }
    UserResponse:
      type: object
      required: [id, display_name, timezone, global_status]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        display_name: { type: string, maxLength: 120 }
        timezone: { type: string, example: Asia/Shanghai }
        global_status: { type: string, enum: [ACTIVE, SUSPENDED, DELETED] }
        accessibility_settings: { type: object, additionalProperties: true }
        created_at: { $ref: '#/components/schemas/Timestamp' }
    DeviceSessionResponse:
      type: object
      required: [id, device_name, created_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        device_name: { type: string }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        last_seen_at: { $ref: '#/components/schemas/Timestamp' }
    TokenPair:
      type: object
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token: { type: string, writeOnly: true }
        refresh_token: { type: string, writeOnly: true }
        token_type: { type: string, enum: [Bearer] }
        expires_in: { type: integer, minimum: 1 }
    LoginRequest:
      type: object
      required: [credential, device]
      properties:
        credential:
          type: object
          required: [type, identifier]
          properties:
            type: { type: string, enum: [DEMO, VERIFICATION_CODE] }
            identifier: { type: string, maxLength: 160 }
            proof: { type: string, writeOnly: true, maxLength: 256 }
        device:
          type: object
          required: [device_id, name, app_version]
          properties:
            device_id: { type: string, maxLength: 160 }
            name: { type: string, maxLength: 120 }
            app_version: { type: string, maxLength: 64 }
    RefreshTokenRequest:
      type: object
      required: [refresh_token]
      properties: { refresh_token: { type: string, writeOnly: true } }
    AuthResponse:
      allOf:
        - $ref: '#/components/schemas/TokenPair'
        - type: object
          required: [user, families, device_session]
          properties:
            user: { $ref: '#/components/schemas/UserResponse' }
            families:
              type: array
              items: { $ref: '#/components/schemas/FamilySummary' }
            device_session: { $ref: '#/components/schemas/DeviceSessionResponse' }
    FamilyCreate:
      type: object
      required: [name]
      properties: { name: { type: string, minLength: 1, maxLength: 120 } }
    FamilySummary:
      type: object
      required: [id, name, status, role]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        status: { type: string, enum: [ACTIVE, SUSPENDED, DELETED] }
        role: { $ref: '#/components/schemas/FamilyRole' }
        member_status: { $ref: '#/components/schemas/MemberStatus' }
    FamilyResponse:
      allOf:
        - $ref: '#/components/schemas/FamilySummary'
        - type: object
          properties:
            created_by_user_id: { $ref: '#/components/schemas/Id' }
            created_at: { $ref: '#/components/schemas/Timestamp' }
            updated_at: { $ref: '#/components/schemas/Timestamp' }
    FamilyMemberResponse:
      type: object
      required: [id, family_id, user_id, role, status, version]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        family_id: { $ref: '#/components/schemas/Id' }
        user_id: { $ref: '#/components/schemas/Id' }
        display_name: { type: string }
        role: { $ref: '#/components/schemas/FamilyRole' }
        status: { $ref: '#/components/schemas/MemberStatus' }
        permission_codes: { type: array, items: { type: string } }
        version: { $ref: '#/components/schemas/Version' }
        joined_at: { $ref: '#/components/schemas/Timestamp' }
    FamilyMemberUpdate:
      type: object
      minProperties: 1
      properties:
        role: { $ref: '#/components/schemas/FamilyRole' }
        status: { $ref: '#/components/schemas/MemberStatus' }
        permission_codes: { type: array, items: { type: string }, maxItems: 50 }
    InvitationCreate:
      type: object
      required: [target_role, expires_at]
      properties:
        target_role: { $ref: '#/components/schemas/FamilyRole' }
        expires_at: { $ref: '#/components/schemas/Timestamp' }
        max_usage: { type: integer, minimum: 1, maximum: 10, default: 1 }
        requested_scopes: { type: array, items: { $ref: '#/components/schemas/ConsentScope' } }
    InvitationResponse:
      type: object
      required: [id, family_id, target_role, status, expires_at, token]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        family_id: { $ref: '#/components/schemas/Id' }
        target_role: { $ref: '#/components/schemas/FamilyRole' }
        status: { type: string, enum: [ACTIVE, USED, REVOKED, EXPIRED] }
        expires_at: { $ref: '#/components/schemas/Timestamp' }
        token: { type: string, writeOnly: true, description: Returned once for QR/deep link display }
    InvitationAccept:
      type: object
      properties:
        confirm_identity: { type: boolean, const: true }
        requested_display_name: { type: string, maxLength: 120 }
    MeResponse:
      type: object
      required: [user, family_memberships]
      properties:
        user: { $ref: '#/components/schemas/UserResponse' }
        family_memberships: { type: array, items: { $ref: '#/components/schemas/FamilyMemberResponse' } }
        active_device_session: { $ref: '#/components/schemas/DeviceSessionResponse' }
    ConsentCreate:
      type: object
      required: [family_id, subject_user_id, grantee_user_id, scope, source]
      properties:
        family_id: { $ref: '#/components/schemas/Id' }
        subject_user_id: { $ref: '#/components/schemas/Id' }
        grantee_user_id: { $ref: '#/components/schemas/Id' }
        scope: { $ref: '#/components/schemas/ConsentScope' }
        source: { type: string, enum: [ONBOARDING, SETTINGS, IMPORT] }
        expires_at: { $ref: '#/components/schemas/Timestamp' }
        confirmation_text: { type: string, maxLength: 500 }
    ConsentRevoke:
      type: object
      properties: { reason: { type: string, maxLength: 240 } }
    ConsentResponse:
      type: object
      required: [id, family_id, subject_user_id, grantee_user_id, scope, status, version]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        family_id: { $ref: '#/components/schemas/Id' }
