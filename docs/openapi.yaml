      schema:
        type: string
        format: uuid
    get:
      tags:
      - Notifications
      operationId: getNotificationPreference
      responses:
        '200':
          description: Own recipient preference; default version 0, IN_APP only, 22-08 Asia/Shanghai when no family
            timezone is available. No consent implied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferenceResponse'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    put:
      tags:
      - Notifications
      operationId: putNotificationPreference
      parameters:
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationPreferenceInput'
      responses:
        '200':
          description: Updated own preferences, version incremented. Mock PUSH only; SMS/PHONE unsupported. Does
            not grant consent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferenceResponse'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
