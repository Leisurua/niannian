    InvitationId:
      name: invitation_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    MemberId:
      name: member_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    ConsentId:
      name: consent_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    MemoryId:
      name: memory_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    FileId:
      name: file_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    ReminderId:
      name: reminder_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    ExecutionId:
      name: execution_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    ConversationId:
      name: conversation_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    EventId:
      name: event_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    NotificationId:
      name: notification_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        maxLength: 512
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
  responses:
    AuthError:
      description: Authentication failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ForbiddenError:
      description: Authenticated but not allowed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFoundError:
      description: Missing or intentionally hidden resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequestError:
      description: Invalid state transition or request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Schema validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ConflictError:
      description: Conflict or optimistic concurrency failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimitError:
      description: Rate limited
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnavailableError:
      description: Service or provider temporarily unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    FileTooLargeError:
      description: File exceeds configured limit
