name: Week 2 auth family consent

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: week2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: niannian_week2_test
          POSTGRES_USER: niannian
          POSTGRES_PASSWORD: week2-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U niannian -d niannian_week2_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      APP_ENV: test
      PROVIDER_MODE: mock
      DATABASE_URL: postgresql+psycopg://niannian:week2-test-only@127.0.0.1:5432/niannian_week2_test
      WEEK2_TEST_DATABASE_URL: postgresql+psycopg://niannian:week2-test-only@127.0.0.1:5432/niannian_week2_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install locked application and check tools
        run: python -m pip install -r backend/requirements.lock -r requirements-ci.txt
      - name: Disposable schema upgrade, empty downgrade and re-upgrade
        working-directory: backend
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head
      - name: Migration parity, auth, family, consent, live API and privacy gates
        run: python scripts/verify_week2.py
      - name: Preserve check evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: week2-postgres-${{ github.sha }}
          path: artifacts/week2/
          if-no-files-found: error
          retention-days: 7
