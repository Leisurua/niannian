name: PR12 Linux and Windows compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Test Windows HTTP clients (mock server)
        run: |
          PYTHONPATH=windows/family-client/src python -m unittest discover -s windows/family-client/tests -v
          PYTHONPATH=windows/elder-demo/src python -m unittest discover -s windows/elder-demo/tests -v
      - name: Validate Linux Compose
        run: |
          cp infra/linux/.env.example infra/linux/.env
          docker compose --env-file infra/linux/.env -f infra/linux/docker-compose.yml config --quiet
      - name: Test S3 public URL compatibility
        run: |
          python -m pip install -r backend/requirements.lock
          PYTHONPATH=backend python -m pytest backend/tests/unit/test_s3_public_endpoint.py -q
