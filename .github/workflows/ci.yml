name: CI

on:
  push:
    paths: ['backend/**', 'android/**', 'windows/**', 'infra/**', 'scripts/**', 'tests/**', '*.toml', 'pytest.ini', 'requirements-ci.txt', 'docs/openapi.yaml', '.github/workflows/**']
  pull_request:
    paths: ['backend/**', 'android/**', 'windows/**', 'infra/**', 'scripts/**', 'tests/**', '*.toml', 'pytest.ini', 'requirements-ci.txt', 'docs/openapi.yaml', '.github/workflows/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      android: ${{ steps.scope.outputs.android }}
      integration: ${{ steps.scope.outputs.integration }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - id: scope
        name: Select affected checks
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python - <<'PY'
          import os, subprocess
          base = os.environ.get('BASE', '')
          args = ['diff', '--name-only', base, 'HEAD'] if base and base.strip('0') else ['ls-files']
          files = subprocess.check_output(['git', *args], text=True).splitlines()
          common = any(p.startswith(('.github/', 'scripts/')) or p in ('pytest.ini', 'requirements-ci.txt') for p in files)
          backend = common or any(p.startswith(('backend/', 'tests/')) or p in ('ruff.toml', 'docs/openapi.yaml') for p in files)
          windows = common or any(p.startswith('windows/') for p in files)
          android = common or any(p.startswith('android/') for p in files)
          integration = common or any(p.startswith(('backend/app/', 'backend/alembic/', 'backend/tests/integration/')) or p in ('backend/tests/support.py', 'backend/tests/conftest.py', 'backend/requirements.lock', 'docs/openapi.yaml') or p.startswith('windows/src/') for p in files)
          infra = common or any(p.startswith('infra/') for p in files)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key, value in dict(backend=backend, windows=windows, android=android, integration=integration, infra=infra).items():
                  output.write(f'{key}={str(value).lower()}\n')
          PY
      - if: steps.scope.outputs.backend == 'true' || steps.scope.outputs.windows == 'true'
        run: python -m pip install -r backend/requirements.lock -r requirements-ci.txt
      - if: steps.scope.outputs.backend == 'true' || steps.scope.outputs.windows == 'true'
        run: python scripts/verify.py lint
      - if: steps.scope.outputs.backend == 'true'
        run: python scripts/verify.py test
      - if: steps.scope.outputs.windows == 'true'
        run: python scripts/verify.py windows
      - name: Validate deployment configuration
        if: steps.scope.outputs.infra == 'true'
        run: docker compose --env-file infra/linux/.env.example -f infra/linux/docker-compose.yml config --quiet

  integration:
    needs: python
    if: needs.python.outputs.integration == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: niannian_test
          POSTGRES_USER: niannian
          POSTGRES_PASSWORD: fictional-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U niannian -d niannian_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      APP_ENV: test
      PROVIDER_MODE: mock
      TEST_DATABASE_URL: postgresql+psycopg://niannian:fictional-ci-only@127.0.0.1:5432/niannian_test
      DATABASE_URL: postgresql+psycopg://niannian:fictional-ci-only@127.0.0.1:5432/niannian_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.lock -r requirements-ci.txt
      - name: Prepare the test schema
        working-directory: backend
        run: python -m alembic upgrade head
      - run: python scripts/verify.py integration

  android:
    needs: python
    if: needs.python.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - name: Shared tests and two Demo builds
        working-directory: android
        run: ./gradlew :shared:testDebugUnitTest :shared:lintDebug :app-elder:assembleDemoDebug :app-family:assembleDemoDebug
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check the built Demo packages for sensitive data
        env:
          NIANNIAN_REQUIRE_APKS: '1'
        run: python -m unittest discover -s tests/security -p test_artifact_scan.py
