name: Windows client regression

on:
  push:
    paths:
      - 'windows/**'
      - 'tests/unit/test_windows_client_reliability.py'
      - '.github/workflows/windows-clients.yml'
  pull_request:
    paths:
      - 'windows/**'
      - 'tests/unit/test_windows_client_reliability.py'
      - '.github/workflows/windows-clients.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clients:
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      PYTHONPATH: 'windows/family-client/src;windows/elder-demo/src'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest==8.3.4
      - name: Test both clients without a GUI session
        run: >-
          python -m pytest -q --import-mode=importlib
          windows/family-client/tests windows/elder-demo/tests
          tests/unit/test_windows_client_reliability.py
