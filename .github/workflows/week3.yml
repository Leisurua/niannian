name: Week 3 memory reminder conversation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: week3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: niannian_week3_test
          POSTGRES_USER: niannian
          POSTGRES_PASSWORD: week3-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U niannian -d niannian_week3_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      APP_ENV: test
      PROVIDER_MODE: mock
      DATABASE_URL: postgresql+psycopg://niannian:week3-test-only@127.0.0.1:5432/niannian_week3_test
      WEEK3_TEST_DATABASE_URL: postgresql+psycopg://niannian:week3-test-only@127.0.0.1:5432/niannian_week3_test
      WEEK2_TEST_DATABASE_URL: postgresql+psycopg://niannian:week3-test-only@127.0.0.1:5432/niannian_week2_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: python -m pip install -r backend/requirements.lock -r requirements-ci.txt
      - name: Create separate baseline regression database
        run: |
          python - <<'PY'
          import os, psycopg
          from sqlalchemy.engine import make_url
          u = make_url(os.environ['WEEK3_TEST_DATABASE_URL'])
          with psycopg.connect(host=u.host, port=u.port, user=u.username, password=u.password, dbname=u.database, autocommit=True) as db:
              db.execute('CREATE DATABASE niannian_week2_test')
          PY
      - name: Empty schema upgrade, downgrade, re-upgrade
        working-directory: backend
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head
      - name: PostgreSQL, WSS, policy, unit and privacy checks
        run: python scripts/verify_week3.py --postgres-only
      - name: Preserve PostgreSQL evidence (real MinIO is a separate local gate)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: week3-postgres-${{ github.sha }}
          path: artifacts/week3/
          if-no-files-found: error
          retention-days: 7
