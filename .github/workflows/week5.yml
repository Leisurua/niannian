name: Week 5 RAG and offline reminder contracts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: week5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: niannian_week3_test
          POSTGRES_USER: niannian
          POSTGRES_PASSWORD: week5-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U niannian -d niannian_week3_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PYTHONUTF8: '1'
      APP_ENV: test
      PROVIDER_MODE: mock
      WEEK2_TEST_DATABASE_URL: postgresql+psycopg://niannian:week5-test-only@127.0.0.1:5432/niannian_week2_test
      WEEK3_TEST_DATABASE_URL: postgresql+psycopg://niannian:week5-test-only@127.0.0.1:5432/niannian_week3_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.lock -r requirements-ci.txt
      - name: Start isolated test storage from the repository's pinned source build
        run: |
          docker build --target server -t niannian-week5-minio infra/minio
          docker run --detach --name niannian-week5-minio -p 127.0.0.1:59003:9000 \
            -e MINIO_ROOT_USER=week5-fictional -e MINIO_ROOT_PASSWORD=fictional-week5-storage \
            niannian-week5-minio server /data
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:59003/minio/health/live; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:59003/minio/health/live
      - name: Prepare disposable test database and storage settings
        run: |
          python - <<'PY'
          import json, os, psycopg
          from pathlib import Path
          from sqlalchemy.engine import make_url
          u = make_url(os.environ['WEEK3_TEST_DATABASE_URL'])
          with psycopg.connect(host=u.host, port=u.port, user=u.username, password=u.password, dbname=u.database, autocommit=True) as db:
              db.execute('CREATE DATABASE niannian_week2_test')
          p = Path(os.environ['RUNNER_TEMP']) / 'week5-storage.json'
          p.write_text(json.dumps(dict(endpoint='http://127.0.0.1:59003', bucket='niannian-week3-test',
              access_key='week5-fictional', secret_key='fictional-week5-storage')))
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('WEEK3_STORAGE_CONFIG=' + str(p) + '\n')
          PY
      - name: Verify source snapshot, RAG, leases, storage and offline feedback
        run: python scripts/verify_week5.py --source "$RUNNER_TEMP/week5-source"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: week5-backend-${{ github.sha }}
          path: artifacts/week5/verification/
          if-no-files-found: error
          retention-days: 7
