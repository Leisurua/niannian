name: Week 1 foundation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: week1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install locked application and check tools
        run: python -m pip install -r backend/requirements.lock -r requirements-ci.txt
      - name: Lint, unit, contract, privacy, demo and backend wheel
        run: python scripts/verify_week1.py --checks backend
      - name: Preserve check evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: week1-backend-${{ github.sha }}
          path: artifacts/week1/
          if-no-files-found: error
          retention-days: 7

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install frozen SDK baseline
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Two apps, all variants, unit tests, lint and mandatory APK scan
        run: python scripts/verify_week1.py --checks android
      - name: Record Android job outcome even when setup fails
        if: always()
        env:
          ANDROID_JOB_STATUS: ${{ job.status }}
        run: |
          python -c "import json, os; from pathlib import Path; p = Path('artifacts/week1'); p.mkdir(parents=True, exist_ok=True); (p / 'android-job.json').write_text(json.dumps({'job_status': os.environ['ANDROID_JOB_STATUS'], 'build_evidence': (p / 'summary.json').exists()}))"
      - name: Preserve reports and demo APKs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: week1-android-${{ github.sha }}
          path: |
            artifacts/week1/
            android/*/build/test-results/
            android/*/build/reports/
            android/app-*/build/outputs/apk/demo/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  infrastructure:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Compose health, vector extension and private bucket
        run: python scripts/verify_week1.py --checks infra
      - name: Preserve infrastructure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: week1-infrastructure-${{ github.sha }}
          path: artifacts/week1/
          if-no-files-found: error
          retention-days: 7
      - name: Release disposable runner services
        if: always()
        run: docker compose -f infra/docker-compose.yml down --volumes
