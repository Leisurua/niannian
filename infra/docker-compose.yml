services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: nianian
      POSTGRES_USER: nianian
      POSTGRES_PASSWORD: nianian-dev-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nianian -d nianian"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: niannian-minio:RELEASE.2025-02-18T16-25-55Z
    build:
      context: ./minio
      target: server
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: nianian-dev-only
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12

  bucket-init:
    image: niannian-mc:RELEASE.2025-02-08T19-14-21Z
    build:
      context: ./minio
      target: client
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing local/nianian-private
        mc anonymous set none local/nianian-private
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: nianian-dev-only
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

volumes:
  postgres_data:
  minio_data:
