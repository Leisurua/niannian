events {}

http {
    # Docker's embedded DNS tracks service addresses when containers are recreated.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;

    upstream niannian_api {
        zone niannian_api 64k;
        server api:8000 resolve;
    }

    upstream niannian_storage {
        zone niannian_storage 64k;
        server minio:9000 resolve;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 443 ssl;
        server_name _;
        client_max_body_size 4m;
        ssl_certificate /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/private.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;

        location / {
            proxy_pass http://niannian_api;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 300s;
        }
    }

    server {
        listen 9443 ssl;
        server_name _;
        ssl_certificate /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/private.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 32m;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;

        location / {
            proxy_pass http://niannian_storage;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
        }
    }
}
