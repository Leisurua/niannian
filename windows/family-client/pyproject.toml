[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "niannian-family-client"
version = "0.1.0"
description = "NianNian Windows family client for classroom demonstrations"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
niannian-family-client = "niannian_family_client.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
