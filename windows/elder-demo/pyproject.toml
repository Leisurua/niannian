[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "niannian-elder-demo"
version = "0.1.0"
description = "NianNian Windows elder demonstration client"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
niannian-elder-demo = "niannian_elder_demo.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
