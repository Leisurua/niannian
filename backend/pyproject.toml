[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nian-nian-backend"
version = "0.1.0"
description = "NianNian FastAPI foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.10.5",
  "pydantic-settings==2.7.1",
  "SQLAlchemy==2.0.37",
  "alembic==1.14.1",
  "psycopg[binary]==3.2.3",
]

[project.optional-dependencies]
test = ["httpx==0.28.1", "pytest==8.3.4", "PyYAML==6.0.2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "config"]

[tool.setuptools.package-data]
config = ["*.env"]
